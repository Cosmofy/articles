extensions:
  health_check:
    endpoint: 127.0.0.1:13135
  file_storage:
    directory: /var/lib/otelcol-contrib/articles

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:24317
      http:
        endpoint: 127.0.0.1:24318
  journald/articles:
    start_at: end
    units:
      - cosmofy-articles.service
    priority: info
    storage: file_storage
    retry_on_failure:
      enabled: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/articles_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.body, log.body["MESSAGE"]) where IsMap(log.body) and log.body["MESSAGE"] != nil
  resource/articles:
    attributes:
      - key: service.name
        value: articles
        action: upsert
      - key: service.namespace
        value: cosmofy
        action: upsert
      - key: service.instance.id
        value: ${env:OTEL_NODE_NAME}
        action: upsert
      - key: host.name
        value: ${env:OTEL_NODE_NAME}
        action: upsert
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: deployment.platform
        value: oracle-cloud
        action: upsert
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  awsxray:
    region: eu-west-2
    local_mode: true
    max_retries: 3
    request_timeout_seconds: 10
    aws_log_groups:
      - /cosmofy/articles/production
    indexed_attributes:
      - http.route
      - http.response.status_code
      - articles.result.source
      - articles.rate_limit.result
  awscloudwatchlogs:
    region: eu-west-2
    log_group_name: /cosmofy/articles/production
    log_stream_name: ${env:OTEL_NODE_NAME}
    raw_log: true
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 2
      queue_size: 1000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
  otlphttp/loki:
    endpoint: http://100.104.171.25:3100/otlp
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 1
      queue_size: 256
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  telemetry:
    metrics:
      level: none
  extensions:
    - health_check
    - file_storage
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/articles
        - batch
      exporters:
        - awsxray
    logs:
      receivers: &articles_log_receivers
        - journald/articles
      processors: &articles_log_processors
        - memory_limiter
        - transform/articles_logs
        - resource/articles
        - batch
      exporters:
        - awscloudwatchlogs
    logs/loki:
      receivers: *articles_log_receivers
      processors: *articles_log_processors
      exporters:
        - otlphttp/loki
